name: briefing-agent

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Run agent
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_ACCOUNTS: ${{ vars.GMAIL_ACCOUNTS }}
          GMAIL_REFRESH_TOKEN_PERSONAL: ${{ secrets.GMAIL_REFRESH_TOKEN_PERSONAL }}
          GMAIL_REFRESH_TOKEN_WORK: ${{ secrets.GMAIL_REFRESH_TOKEN_WORK }}
          ASANA_PAT: ${{ secrets.ASANA_PAT }}
          ASANA_WORKSPACE_GID: ${{ secrets.ASANA_WORKSPACE_GID }}
        run: npm run agent
